[project]
name = "sngm"
version = "0.2.0"
description = "Local Sngm river demos with realtime voice"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "httpx>=0.28", "python-dotenv>=1.0"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]
[tool.pytest.ini_options]
pythonpath = ["."]

asyncio_default_fixture_loop_scope = "function"
